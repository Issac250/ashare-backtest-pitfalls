[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashare-backtest-pitfalls"
version = "0.1.0"
description = "How A-share backtests lie, one runnable reproduction per pitfall, on synthetic data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Issac250" }]
dependencies = [
  "ashare-bt @ git+https://github.com/Issac250/ashare-bt@v0.1.0",
  # Exact: the chapters quote numbers, and a new random stream would move them.
  "numpy==2.5.4",
  "pandas==3.0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://issac250.github.io/ashare-backtest-pitfalls/"
Source = "https://github.com/Issac250/ashare-backtest-pitfalls"

[tool.hatch.metadata]
allow-direct-references = true

# The book is the docs/ and repro/ folders; nothing is installed as a package.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731"]
