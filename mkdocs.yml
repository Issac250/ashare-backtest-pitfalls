site_name: A 股回测避坑手册
site_description: 用 12 个可运行的 Python 例子，检查 A 股回测的成交、数据和统计口径。
site_url: https://issac250.github.io/ashare-backtest-pitfalls/
repo_url: https://github.com/Issac250/ashare-backtest-pitfalls
repo_name: Issac250/ashare-backtest-pitfalls
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Issac250 · MIT License

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

nav:
  - 首页: index.md
  - 成交:
      - 01 收盘信号与成交价: 01-close-price-fills.md
      - 02 涨跌停判断的时点: 02-limit-gate-timing.md
      - 03 停牌与复牌跳空: 03-halt-resumption-gap.md
  - 数据:
      - 04 除权日的持仓估值: 04-unadjusted-prices.md
      - 05 缺失值与股票池: 05-coverage-lookahead.md
      - 06 比值字段的日期: 06-ratio-denominator-date.md
      - 07 停牌与相对收益: 07-halt-relative-return.md
  - 统计与对照:
      - 08 年化收益怎么算: 08-arithmetic-annualization.md
      - 09 平均收益的权重: 09-row-average.md
      - 10 基准的调仓约定: 10-benchmark-rebalance.md
      - 11 分段看策略表现: 11-one-era-dominates.md
      - 12 筛选条件的对照: 12-screen-control.md
